<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{TITLE}}</title>
  </head>
  <body style="margin:0;padding:0;background:#F8FAFC;color:#0F172A;font-family:'Figtree','Segoe UI',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">
      {{PREHEADER}}
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F8FAFC;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="height:4px;background:#00C7C4;background-image:linear-gradient(90deg,#012048 0%,#015363 55%,#00C7C4 100%);font-size:0;line-height:0;">
                &nbsp;
              </td>
            </tr>
            <tr>
              <td style="padding:26px 32px 20px;background:#FFFFFF;border-bottom:1px solid #E2E8F0;">
                <img
                  src="cid:{{LOGO_CID}}"
                  alt="Minha Carteira"
                  width="160"
                  height="60"
                  style="display:block;border:0;outline:none;text-decoration:none;width:160px;height:auto;"
                />
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                {{CONTENT}}
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;background:#F8FAFC;border-top:1px solid #E2E8F0;color:#64748B;font-size:12px;line-height:1.5;">
                Esta é uma mensagem automática do <strong style="color:#012048;">Minha Carteira</strong>. Não responda a este e-mail.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
