$kind: "http-request"
method: "GET"
url: "{{base_url}}/api/v1/auth/me"
order: 5000
description: "Captura user_id e session_id da sessão atual."
scripts:
  - type: "afterResponse"
    language: "text/javascript"
    code: |-
      function setRuntime(key, value) {
        pm.variables.set(key, value);
        pm.collectionVariables.set(key, value);
      }
      pm.test('Status HTTP esperado: 200', () => pm.expect(pm.response.code).to.equal(200));
      pm.test('Contexto da sessão', () => {
        const data = pm.response.json().data;
        pm.expect(data.userId).to.match(/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i);
        pm.expect(data.sessionId).to.match(/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i);
        pm.expect(data.userId).to.equal(pm.variables.get('user_id'));
        setRuntime('user_id', data.userId);
        setRuntime('session_id', data.sessionId);
      });
