$kind: http-request
method: GET
url: "{{base_url}}/api/v1/auth/csrf"
body:
  type: json
  content: ""
order: 1000
description: Obtém o cookie CSRF e captura data.token em csrf_token. Origin é herdado do script da collection.
scripts:
  - type: beforeRequest
    code: |-
      function clearRuntime(key) {
        pm.variables.set(key, '');
        pm.collectionVariables.unset(key);
      }
      clearRuntime('csrf_token');
    language: text/javascript
  - type: afterResponse
    code: |-
      function setRuntime(key, value) {
        pm.variables.set(key, value);
        pm.collectionVariables.set(key, value);
      }
      pm.test('Status HTTP esperado: 200', () => pm.expect(pm.response.code).to.equal(200));
      pm.test('Token CSRF e cookie seguro presentes', () => {
        const token = pm.response.json().data.token;
        pm.expect(token).to.be.a('string').and.not.empty;
        const cookie = pm.response.headers.all().find(header => header.key.toLowerCase() === 'set-cookie' && header.value.startsWith('__Secure-mc_csrf='));
        pm.expect(cookie, 'Cookie CSRF obrigatório').to.exist;
        pm.expect(cookie.value).to.match(/;\s*Secure/i);
        pm.expect(cookie.value).to.match(/;\s*HttpOnly/i);
        pm.expect(decodeURIComponent(cookie.value.split(';')[0].split('=').slice(1).join('='))).to.equal(token);
        setRuntime('csrf_token', token);
      });
    language: text/javascript
