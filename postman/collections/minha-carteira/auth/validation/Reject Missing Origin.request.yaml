$kind: "http-request"
method: "POST"
url: "{{base_url}}/api/v1/auth/login"
order: 1000
description: "Espera 403 quando Origin está ausente."
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "X-CSRF-Token"
    value: "{{csrf_token}}"
body:
  type: "json"
  content: |-
    {
      "identifier": "usuario-inexistente",
      "password": "senha-invalida"
    }
scripts:
  - type: "beforeRequest"
    language: "text/javascript"
    code: |-
      pm.request.headers.remove('Origin');
      function resolveBody(value) {
        if (typeof value === 'string') return pm.variables.replaceIn(value);
        if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, resolveBody(item)]));
        return value;
      }
      pm.request.body.update(JSON.stringify(resolveBody({"identifier":"usuario-inexistente","password":"senha-invalida"})));
  - type: "afterResponse"
    language: "text/javascript"
    code: |-
      pm.test('Status HTTP esperado: 403', () => pm.expect(pm.response.code).to.equal(403));
      pm.test('Contrato de erro', () => {
        const error = pm.response.json();
        pm.expect(error.status).to.equal(403);
        pm.expect(error.message).to.be.a('string').and.not.empty;
      });
