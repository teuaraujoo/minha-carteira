$kind: "http-request"
method: "GET"
url: "{{base_url}}/health"
order: 100
description: "Verifica a disponibilidade HTTP."
scripts:
  - type: "afterResponse"
    language: "text/javascript"
    code: |-
      pm.test('Status HTTP esperado: 200', () => pm.expect(pm.response.code).to.equal(200));
      pm.test('Estado de saúde', () => pm.expect(pm.response.json()).to.deep.equal({status:'ok'}));
