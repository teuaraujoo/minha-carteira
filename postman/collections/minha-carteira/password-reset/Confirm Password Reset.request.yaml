$kind: "http-request"
method: "POST"
url: "{{base_url}}/api/v1/auth/password-reset/confirm"
order: 2000
description: "Configure password_reset_token no ambiente local com o token recebido por e-mail (challengeId.secret). Sem token, a etapa é pulada."
headers:
  - key: "Content-Type"
    value: "application/json"
  - key: "X-CSRF-Token"
    value: "{{csrf_token}}"
body:
  type: "json"
  content: |-
    {
      "token": "{{password_reset_token}}",
      "password": "{{new_password}}",
      "passwordConfirmation": "{{new_password}}",
      "metadata": {
        "location": null,
        "deviceId": null
      }
    }
scripts:
  - type: "beforeRequest"
    language: "text/javascript"
    code: |-
      function fail(message) {
        pm.execution.skipRequest();
        throw new Error(message);
      }
      const token = String(pm.variables.get('password_reset_token') || '').trim();
      if (!token) {
        console.warn('Confirmação pulada: configure password_reset_token com o token recebido por e-mail.');
        pm.execution.skipRequest();
      } else {
        if (!/^[^.]+\.[^.]+$/.test(token)) fail('Token deve seguir o formato challengeId.secret.');
        pm.variables.set('password_reset_token', token);
        if (!pm.variables.get('new_password')) pm.variables.set('new_password', pm.variables.replaceIn('{{$guid}}') + '!Aa9');
      }
      function resolveBody(value) {
        if (typeof value === 'string') return pm.variables.replaceIn(value);
        if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, resolveBody(item)]));
        return value;
      }
      pm.request.body.update(JSON.stringify(resolveBody({"token":"{{password_reset_token}}","password":"{{new_password}}","passwordConfirmation":"{{new_password}}","metadata":{"location":null,"deviceId":null}})));
  - type: "afterResponse"
    language: "text/javascript"
    code: |-
      function clearRuntime(key) {
        pm.variables.set(key, '');
        pm.collectionVariables.unset(key);
      }
      function setRuntime(key, value) {
        pm.variables.set(key, value);
        pm.collectionVariables.set(key, value);
      }
      pm.test('Status HTTP esperado: 204', () => pm.expect(pm.response.code).to.equal(204));
      pm.test('Resposta sem corpo', () => pm.expect(pm.response.text()).to.equal(''));
      if (pm.response.code === 204) {
        clearRuntime('user_id');
        clearRuntime('session_id');
        const email = pm.variables.get('email_flow_email') || pm.variables.get('test_email');
        if (String(email || '').toLowerCase() === String(pm.variables.get('test_email') || '').toLowerCase()) setRuntime('test_password', pm.variables.get('new_password'));
      }
